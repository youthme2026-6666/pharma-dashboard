# 医药行业财务看板：每天逐家公司检查官方新申报（SEC、港交所、巨潮）、补新季度、用 GPT 更新重大事件，核对通过后发布到 GitHub Pages。
# 需要在仓库 Settings 里设置：
#   Secrets：SEC_USER_AGENT（例如 "Lilly Dashboard you@example.com"）、OPENAI_API_KEY
#   Variables（可选）：OPENAI_MODEL（不设置时自动从可用模型里挑）
#   Pages：Source 选 "GitHub Actions"
name: 医药行业财务看板自动更新

on:
  schedule:
    - cron: "23 13 * * *"   # 每天 13:23 UTC（北京时间 21:23；美股公司多在美东早上发布业绩）
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        options: [auto, events, backtest, check, selftest, site]
        default: auto
      company:
        description: "只处理这些公司（公司清单里的 id，空格分隔；留空为全部）"
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pharma-dashboard-${{ github.ref }}   # 各分支（开发中的并行会话）互不排队；main 上的运行依次进行
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      site: ${{ steps.site.outputs.built }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 缓存从 SEC 下载的文件（归档文件不会变）
        uses: actions/cache@v6
        with:
          path: agent/.cache
          key: sec-v1-${{ hashFiles('agent/pipeline/*.py') }}
          restore-keys: sec-v1-

      - name: 单元测试（解析、组装、GPT 核对规则、端到端流程）
        run: python -m unittest discover -s agent/tests -t .
        env:
          DASH_QUIET: "1"

      - name: 临时：取 SEC 样本（只在 sec-adapter 分支的 selftest 运行）
        if: inputs.mode == 'selftest' && github.ref_name == 'sec-adapter'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PROBE_COMPANIES: ${{ inputs.company }}
        run: |
          python3 - <<'PY'
          import json, os, sys, traceback
          sys.path.insert(0, ".")
          from agent.pipeline.sec import SEC
          sec = SEC(cache_dir="agent/.cache/sec")
          out = "probe"
          os.makedirs(out, exist_ok=True)
          tick = sec.json("https://www.sec.gov/files/company_tickers.json", ttl=0)
          with open(out + "/company_tickers.json", "w") as f:
              json.dump(tick, f)
          want = {"lly": "LLY", "jnj": "JNJ", "mrk": "MRK", "abbv": "ABBV", "pfe": "PFE", "bmy": "BMY", "amgn": "AMGN", "gild": "GILD",
                  "mrna": "MRNA", "alny": "ALNY", "ions": "IONS", "crsp": "CRSP", "srpt": "SRPT", "bmrn": "BMRN", "mdt": "MDT", "isrg": "ISRG",
                  "bsx": "BSX", "tmo": "TMO", "dhr": "DHR", "veev": "VEEV", "sdgr": "SDGR", "beone": "ONC", "nvo": "NVO"}
          only = os.environ.get("PROBE_COMPANIES", "").split()
          m = {v["ticker"].upper(): v["cik_str"] for v in tick.values()}
          for cid, t in want.items():
              if only and cid not in only:
                  continue
              cik = m.get(t)
              print(cid, t, cik, flush=True)
              if not cik:
                  continue
              d = "%s/%s" % (out, cid)
              os.makedirs(d, exist_ok=True)
              try:
                  sub = sec.json("https://data.sec.gov/submissions/CIK%010d.json" % cik, ttl=0)
                  with open(d + "/submissions.json", "w") as f:
                      json.dump(sub, f)
                  with open(d + "/companyfacts.json", "wb") as f:
                      f.write(sec.get("https://data.sec.gov/api/xbrl/companyfacts/CIK%010d.json" % cik, ttl=0))
                  r = sub["filings"]["recent"]
                  picked = {}
                  for i, form in enumerate(r["form"]):
                      if form in ("10-K", "10-Q", "20-F") and picked.get(form, 0) < (2 if form == "10-Q" else 1):
                          picked[form] = picked.get(form, 0) + 1
                          acc, rd = r["accessionNumber"][i], r["reportDate"][i]
                          folder = "https://www.sec.gov/Archives/edgar/data/%d/%s/" % (cik, acc.replace("-", ""))
                          idx = sec.json(folder + "index.json", ttl=0)
                          fd = "%s/%s_%s" % (d, form, rd)
                          os.makedirs(fd, exist_ok=True)
                          with open(fd + "/index.json", "w") as f:
                              json.dump(idx, f)
                          for it in idx["directory"]["item"]:
                              n = it["name"]
                              if n.endswith(("_htm.xml", "_lab.xml", "_def.xml", "_pre.xml")):
                                  with open(fd + "/" + n, "wb") as f:
                                      f.write(sec.get(folder + n))
              except Exception:
                  traceback.print_exc()
          print("requests", sec.requests)
          PY
          du -sh probe; ls probe | head -40

      - name: 临时：上传 SEC 样本
        if: always() && inputs.mode == 'selftest' && github.ref_name == 'sec-adapter'
        uses: actions/upload-artifact@v7
        with:
          name: sec-probe
          path: probe
          retention-days: 5

      - name: 运行维护流程
        id: run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MODE: ${{ inputs.mode || 'auto' }}
          COMPANIES: ${{ inputs.company }}
        run: |
          args="$MODE"
          if [ "$MODE" = "events" ]; then args="auto --events"; fi
          for c in $COMPANIES; do args="$args --company $c"; done
          python -m agent.core.run $args

      - name: 提交数据变化
        if: always() && steps.run.outcome != 'skipped'
        run: |
          git config user.name "pharma-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state companies
          if git diff --cached --quiet; then
            echo "数据没有变化"
          else
            git commit -m "数据自动更新 $(date -u +%F)"
            git push
          fi

      - name: 检查网页是否生成
        id: site
        if: always()
        run: |
          if [ -f _site/index.html ]; then echo "built=true" >> "$GITHUB_OUTPUT"; fi

      - name: 上传网页
        if: always() && steps.site.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 出问题时开 issue（同一问题只开一个，之后追加评论）
        if: failure() && github.ref == 'refs/heads/main'   # 开发分支上的试运行不开 issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dashboard-bot --color B60205 --description "看板自动维护" 2>/dev/null || true
          body=agent/output/report.md
          if [ ! -f "$body" ]; then
            echo "流程在生成报告之前就失败了（例如单元测试没通过），请看运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$body"
          fi
          num=$(gh issue list --label dashboard-bot --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$body"
          else
            gh issue create --title "看板自动维护需要处理（$(date -u +%F)）" --label dashboard-bot --body-file "$body"
          fi

  deploy:
    needs: update
    if: always() && needs.update.outputs.site == 'true' && github.ref == 'refs/heads/main'   # 只有 main 发布网页
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
