# 礼来看板：每天自动检查 SEC 新申报、补新季度、用 GPT 更新重大事件，然后发布到 GitHub Pages。
# 需要在仓库 Settings 里设置：
#   Secrets：SEC_USER_AGENT（例如 "Lilly Dashboard you@example.com"）、OPENAI_API_KEY
#   Variables（可选）：OPENAI_MODEL（不设置时自动从可用模型里挑）
#   Pages：Source 选 "GitHub Actions"
name: 礼来看板自动更新

on:
  schedule:
    - cron: "23 13 * * *"   # 每天 13:23 UTC（美东早上 8~9 点；礼来通常在美东早上发布业绩）
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        options: [auto, events, backtest, check, selftest, site]
        default: auto

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: lilly-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      site: ${{ steps.site.outputs.built }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 缓存从 SEC 下载的文件（归档文件不会变）
        uses: actions/cache@v6
        with:
          path: agent/.cache
          key: sec-v1-${{ hashFiles('agent/pipeline/*.py') }}
          restore-keys: sec-v1-

      - name: 单元测试（解析、组装、GPT 核对规则、端到端流程）
        run: python -m unittest discover -s agent/tests -t .
        env:
          DASH_QUIET: "1"

      - name: 运行维护流程
        id: run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -m agent.pipeline.run ${{ inputs.mode || 'auto' }}

      - name: 提交数据变化
        if: always() && steps.run.outcome != 'skipped'
        run: |
          git config user.name "lilly-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git add agent/state.json agent/learned.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "数据没有变化"
          else
            git commit -m "数据自动更新 $(date -u +%F)"
            git push
          fi

      - name: 检查网页是否生成
        id: site
        if: always()
        run: |
          if [ -f _site/index.html ]; then echo "built=true" >> "$GITHUB_OUTPUT"; fi

      - name: 上传网页
        if: always() && steps.site.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 出问题时开 issue（同一问题只开一个，之后追加评论）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dashboard-bot --color B60205 --description "看板自动维护" 2>/dev/null || true
          body=agent/output/report.md
          if [ ! -f "$body" ]; then
            echo "流程在生成报告之前就失败了（例如单元测试没通过），请看运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$body"
          fi
          num=$(gh issue list --label dashboard-bot --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$body"
          else
            gh issue create --title "看板自动维护需要处理（$(date -u +%F)）" --label dashboard-bot --body-file "$body"
          fi

  deploy:
    needs: update
    if: always() && needs.update.outputs.site == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
